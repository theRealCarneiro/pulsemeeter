name: i18n Catalog Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-catalogs:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Babel
      run: |
        python -m pip install --upgrade pip
        pip install babel setuptools

    - name: Regenerate .pot
      run: python setup.py extract_messages

    - name: Fail if the template is out of sync with the source
      run: |
        # Only the .pot is checked. Weblate owns the .po files and rewrites
        # their headers. Weblate never regenerates the template itself.
        # -I skips the auto-stamped creation date.
        if ! git diff --exit-code -I 'POT-Creation-Date' -I '^# Copyright' -- locale/pulsemeeter.pot; then
          echo "::error::locale/pulsemeeter.pot is out of sync with the source."
          echo "Run 'python setup.py extract_messages' and commit the result."
          exit 1
        fi
